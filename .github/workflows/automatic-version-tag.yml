name: Automatic Version Tag

on:
  workflow_run:
    workflows: ["DroidUI Inspection Gates"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: automatic-version-tag-main
  cancel-in-progress: false

jobs:
  tag-version:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out inspected main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read and validate app version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./app/package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer in app/package.json: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create annotated version tag if absent
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch --tags --force
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; no action taken."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "DroidUI release $VERSION"
          git push origin "$TAG"
          echo "Created $TAG after successful inspection gates."
