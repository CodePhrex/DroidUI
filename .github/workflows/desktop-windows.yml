name: DroidUI Desktop Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches:
      - feat/desktop-foundation
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Generate required Tauri icons
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path
          p=Path("src-tauri/icons")
          p.mkdir(parents=True, exist_ok=True)
          im=Image.new("RGBA",(512,512),(21,29,42,255))
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((65,65,447,447),radius=85,fill=(50,105,232,255))
          d.polygon([(256,115),(390,256),(256,397),(122,256)],fill=(240,246,255,255))
          im.save(p/"icon.png")
          im.save(p/"icon.ico",sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Build desktop web frontend
        run: npm run build
      - name: Build Tauri Windows installer
        id: installer
        continue-on-error: true
        run: npm run desktop:build
      - name: Upload compiled portable executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidui-desktop-windows-portable
          path: desktop/src-tauri/target/release/droidui-desktop.exe
          if-no-files-found: error
          retention-days: 14
      - name: Retry installer packaging after transient network failure
        if: steps.installer.outcome == 'failure'
        run: npm run desktop:build
      - name: Verify installer exists
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "No Windows NSIS installer generated" }
          $files | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }
      - uses: actions/upload-artifact@v4
        with:
          name: droidui-desktop-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
