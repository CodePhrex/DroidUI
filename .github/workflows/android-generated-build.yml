name: DroidUI Generated Android Build

on:
  pull_request:
    branches: [main, feat/phase-2h-editor-workspace-controls]
  push:
    branches: [main, feat/phase-2h-editor-workspace-controls]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-generated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-project-build:
    name: Generate and build native Android fixture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bootstrap lockfile for diagnostics when absent
        working-directory: app
        shell: bash
        run: |
          if [[ ! -f package-lock.json ]]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate release version and write manifest
        run: npm run release:integrity --prefix app -- --write-manifest "${{ runner.temp }}/droidui-release-manifest.json"

      - name: TypeScript check
        working-directory: app
        run: npm run typecheck

      - name: Run project generation inspection gate
        working-directory: app
        run: npm run test:android-generation

      - name: Generate Android build fixture
        working-directory: app
        env:
          DROIDUI_ANDROID_OUTPUT_DIR: ${{ runner.temp }}/droidui-generated-android
        run: npm run build:android-fixture

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Gradle memory for Android CI
        working-directory: app/android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("gradle.properties")
          content = path.read_text() if path.exists() else ""
          heap = "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          if re.search(r"(?m)^org\\.gradle\\.jvmargs=.*$", content):
              content = re.sub(r"(?m)^org\\.gradle\\.jvmargs=.*$", heap, content)
          else:
              content = content.rstrip() + "\\n" + heap + "\\n"
          settings = {
              "org.gradle.parallel": "false",
              "org.gradle.workers.max": "2",
          }
          for key, value in settings.items():
              content = re.sub(rf"(?m)^{re.escape(key)}=.*$", f"{key}={value}", content)
              if not re.search(rf"(?m)^{re.escape(key)}=", content):
                  content = content.rstrip() + f"\\n{key}={value}\\n"
          path.write_text(content)
          print(path.read_text())
          PY

      - name: Build generated debug and release APKs
        working-directory: ${{ runner.temp }}/droidui-generated-android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload generated APKs and release manifest
        uses: actions/upload-artifact@v4
        with:
          name: droidui-generated-android-apks
          path: |
            ${{ runner.temp }}/droidui-generated-android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/droidui-generated-android/app/build/outputs/apk/release/*.apk
            ${{ runner.temp }}/droidui-release-manifest.json
          if-no-files-found: error
          retention-days: 14

  version-tag:
    name: Tag verified main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: generated-project-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable build tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="droidui-v${VERSION}-${SHORT_SHA}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 1
          fi
          git tag -a "$TAG" "$GITHUB_SHA" -m "Verified generated Android build for DroidUI $VERSION"
          git push origin "$TAG"
          echo "Created verified build tag: $TAG"
