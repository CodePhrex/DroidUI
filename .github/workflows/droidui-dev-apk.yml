name: DroidUI Android Application APK

on:
  workflow_dispatch:
  push:
    branches: [main, overhaul]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/droidui-dev-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/droidui-dev-apk.yml'

permissions:
  contents: read

concurrency:
  group: droidui-android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify the actual DroidUI app
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        working-directory: app
        run: npm run typecheck

      - name: Run editor and project regression tests
        working-directory: app
        run: |
          npm run test:validation
          npm run test:editor-state
          npm run test:android-generation
          npm run release:integrity

      - name: Validate Expo configuration
        working-directory: app
        run: npx expo config --type public

      - name: Generate native Android project
        working-directory: app
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Enable a self-contained debug APK
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          source = path.read_text()
          marker = 'project.ext.react = ['
          if 'bundleInDebug:' not in source:
              if marker not in source:
                  print('Could not locate React Native project.ext.react block in generated app/build.gradle')
                  print('\n'.join(line for line in source.splitlines() if 'react' in line.lower() or 'bundle' in line.lower()))
                  raise SystemExit(1)
              source = source.replace(marker, marker + '\n    bundleInDebug: true,', 1)
              path.write_text(source)
          print('Enabled bundleInDebug so the APK includes its JavaScript bundle and does not require Metro.')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Assemble actual DroidUI debug APK
        working-directory: app/android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK package, app label, and React Native bundle
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          test -s "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='com.codephrex.droidstudio'" <<< "$BADGING"
          grep -F "application-label:'Droid Studio UI/UX'" <<< "$BADGING"
          echo "APK JavaScript bundle entries:"
          unzip -Z1 "$APK" | grep -E '(^|/)index\.android\.bundle(\.hbc)?
          echo "Verified actual DroidUI application APK:"
          ls -lh "$APK"

      - name: Upload actual DroidUI APK
        uses: actions/upload-artifact@v4
        with:
          name: droidui-overhaul-debug-apk-${{ github.sha }}
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

          echo "Verified actual DroidUI application APK:"
          ls -lh "$APK"

      - name: Upload actual DroidUI APK
        uses: actions/upload-artifact@v4
        with:
          name: droidui-overhaul-debug-apk-${{ github.sha }}
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
