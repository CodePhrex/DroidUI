name: DroidUI Real Android Dev APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main, feat/phase-2h-editor-workspace-controls]
    paths:
      - 'app/**'
      - '.github/workflows/droidui-dev-apk.yml'
  push:
    branches:
      - 'feat/phase-2g-release-integrity'
      - 'feat/phase-2h-editor-workspace-controls'

permissions:
  contents: read

concurrency:
  group: droidui-dev-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build real DroidUI Android development APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        working-directory: app
        run: npm run typecheck

      - name: Validate Expo configuration
        working-directory: app
        run: npx expo config --type public

      - name: Generate native Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Configure Gradle memory for Android CI
        working-directory: app/android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("gradle.properties")
          content = path.read_text() if path.exists() else ""
          heap = "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          if re.search(r"(?m)^org\.gradle\.jvmargs=.*$", content):
              content = re.sub(r"(?m)^org\.gradle\.jvmargs=.*$", heap, content)
          else:
              content = content.rstrip() + "\n" + heap + "\n"
          settings = {
              "org.gradle.parallel": "false",
              "org.gradle.workers.max": "2",
          }
          for key, value in settings.items():
              content = re.sub(rf"(?m)^{re.escape(key)}=.*$", f"{key}={value}", content)
              if not re.search(rf"(?m)^{re.escape(key)}=", content):
                  content = content.rstrip() + f"\n{key}={value}\n"
          path.write_text(content)
          print(path.read_text())
          PY

      - name: Build installable DroidUI release APK
        working-directory: app/android
        run: gradle --no-daemon assembleRelease

      - name: Verify real APK output
        working-directory: app
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "REAL_DROIDUI_APK=$APK"
          ls -lh "$APK"

      - name: Verify APK identity and embedded DroidUI application bundle
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='com.codephrex.droidstudio'" <<< "$BADGING"
          grep -F "application-label:'DroidUI'" <<< "$BADGING"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          echo "Verified: this artifact is the DroidUI application, not the generated test fixture."

      - name: Upload real DroidUI development APK
        uses: actions/upload-artifact@v4
        with:
          name: droidui-real-dev-apk-${{ github.sha }}
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
